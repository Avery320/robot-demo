<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoboSim Documentation</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0d1117;
      --surface: #161b22;
      --surface-hover: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --link: #58a6ff;
      --active: #1f6feb;
      --danger: #f85149;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      min-height: 56px;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .site-title { color: var(--text); font-size: 16px; font-weight: 600; }
    .language-select {
      margin-left: auto;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--background);
      color: var(--text);
      font: inherit;
    }
    .site-layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: calc(100vh - 57px);
    }
    .sidebar {
      position: sticky;
      top: 57px;
      height: calc(100vh - 57px);
      overflow-y: auto;
      padding: 16px;
      border-right: 1px solid var(--border);
      background: var(--background);
    }
    .navigation-search {
      width: 100%;
      margin-bottom: 12px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      background: var(--background);
      color: var(--text);
      font: inherit;
    }
    .navigation-search:focus { border-color: var(--active); }
    .navigation-search::placeholder { color: var(--muted); }
    .tree-children { margin-left: 16px; }
    .document-navigation.searching details > .tree-children { display: block; }
    .tree-item > summary { display: flex; min-width: 0; align-items: center; cursor: pointer; list-style: none; }
    .tree-item > summary::-webkit-details-marker { display: none; }
    .tree-item > summary::before {
      width: 20px;
      flex: 0 0 20px;
      color: var(--muted);
      content: "›";
      font-size: 18px;
      text-align: center;
    }
    .tree-item[open] > summary::before { transform: rotate(90deg); }
    .tree-item > a,
    .tree-item > span,
    .tree-item > summary > a,
    .tree-item > summary > span {
      display: block;
      min-width: 0;
      flex: 1;
      padding: 5px 7px;
      overflow: hidden;
      border-radius: 6px;
      color: var(--text);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tree-leaf { padding-left: 20px; }
    .tree-item a:hover { background: var(--surface-hover); text-decoration: none; }
    .tree-item a[aria-current] { color: var(--link); }

    .document-main { min-width: 0; padding: 40px 48px; }
    .markdown-body {
      width: min(100%, 980px);
      margin: 0 auto;
      color: var(--text);
      font-size: 16px;
      overflow-wrap: break-word;
    }
    .markdown-body > :first-child { margin-top: 0; }
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      color: var(--text);
      font-weight: 600;
      line-height: 1.25;
    }
    .markdown-body h1,
    .markdown-body h2 { padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
    .markdown-body h1 { margin: 0 0 16px; font-size: 2em; }
    .markdown-body h2 { margin: 32px 0 16px; font-size: 1.5em; }
    .markdown-body h3 { margin: 24px 0 16px; font-size: 1.25em; }
    .markdown-body h4 { margin: 24px 0 12px; font-size: 1em; }
    .markdown-body :is(p, ul, ol, blockquote, pre, table) { margin-top: 0; margin-bottom: 16px; }
    .markdown-body :is(ul, ol) { padding-left: 2em; }
    .markdown-body li + li { margin-top: 0.25em; }
    .markdown-body hr { height: 1px; margin: 24px 0; border: 0; background: var(--border); }
    .markdown-body blockquote {
      margin-left: 0;
      padding: 0 1em;
      border-left: 0.25em solid var(--border);
      color: var(--muted);
    }
    .markdown-body code {
      padding: 0.2em 0.4em;
      border-radius: 6px;
      background: var(--surface);
      font: 85% ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .markdown-body pre { padding: 16px; overflow: auto; border-radius: 6px; background: var(--surface); }
    .markdown-body pre code { padding: 0; background: none; }
    .markdown-body table {
      display: block;
      width: max-content;
      max-width: 100%;
      overflow: auto;
      border-spacing: 0;
      border-collapse: collapse;
    }
    .markdown-body :is(th, td) { padding: 6px 13px; border: 1px solid var(--border); }
    .markdown-body th { font-weight: 600; }
    .markdown-body tr:nth-child(2n) { background: var(--surface); }
    .document-state { color: var(--muted); }
    .document-error { padding: 16px; border: 1px solid var(--danger); border-radius: 6px; color: var(--danger); }

    @media (max-width: 820px) {
      .site-layout { display: block; }
      .sidebar {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      .document-main { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="./index.html">RoboSim Documentation</a>
    <select id="language-select" class="language-select" aria-label="Language">
      <option value="zh-TW">繁體中文</option>
      <option value="en">English</option>
    </select>
  </header>
  <div class="site-layout">
    <aside class="sidebar">
      <input id="navigation-search" class="navigation-search" type="search" placeholder="搜尋文件、Group、Node" aria-label="搜尋文件">
      <nav id="document-navigation" class="document-navigation" aria-label="文件導覽"></nav>
    </aside>
    <main class="document-main">
      <article id="document-content" class="markdown-body" aria-live="polite">
        <p class="document-state">正在載入文件…</p>
      </article>
    </main>
  </div>
  <noscript>JavaScript is required to load this documentation. 此文件網站需要 JavaScript 才能載入。</noscript>
  <script type="module" src="./docs.js"></script>
</body>
</html>
